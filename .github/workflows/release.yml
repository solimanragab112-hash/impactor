name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  BINARY_NAME: plumeimpactor
  BINARY_NAME_CLI: plumesign
  BUNDLE_NAME: Impactor
  TARGET: aarch64-apple-darwin
  SUFFIX: macos-arm64

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build binaries
        run: cargo build --bins --workspace --release --target "$TARGET"

      - name: Package app and DMG
        run: |
          set -euo pipefail

          APP="dist/${BUNDLE_NAME}.app"
          mkdir -p dist
          cp -R "package/macos/${BUNDLE_NAME}.app" "$APP"
          cp "target/${TARGET}/release/${BINARY_NAME}" "$APP/Contents/MacOS/${BUNDLE_NAME}"
          chmod +x "$APP/Contents/MacOS/${BUNDLE_NAME}"

          VERSION=$(awk '/\[workspace.package\]/,/^$/' Cargo.toml | sed -nE 's/version *= *"([^"]*)".*/\1/p')
          test -n "$VERSION"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" "$APP/Contents/Info.plist"

          # Fork 版本不做 Developer ID 签名与公证，只做无需证书的 ad-hoc 签名，
          # 以满足 Apple Silicon 对代码签名的要求。
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

          mkdir -p dist/dmg
          mv "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "$BUNDLE_NAME" \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            "dist/${BUNDLE_NAME}-${SUFFIX}.dmg"

          cp "target/${TARGET}/release/${BINARY_NAME_CLI}" "dist/${BINARY_NAME_CLI}-${SUFFIX}"
          rm -rf dist/dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BUNDLE_NAME }}-${{ env.SUFFIX }}
          path: |
            dist/${{ env.BUNDLE_NAME }}-${{ env.SUFFIX }}.dmg
            dist/${{ env.BINARY_NAME_CLI }}-${{ env.SUFFIX }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos-arm64]
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.BUNDLE_NAME }}-${{ env.SUFFIX }}
          path: upload

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            upload/*.dmg
            upload/plumesign-*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
